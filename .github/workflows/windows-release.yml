name: Windows installer and draft release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (first release has no lockfile yet)
        run: npm install --no-audit --no-fund
      - name: Install test browser
        run: npx playwright install chromium
      - name: Run release tests
        run: npm run test:release
      - name: Compile native controllers (no device mutations)
        run: npm run check:windows
      - name: Build unsigned x64 installer
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify unpacked native source files
        shell: pwsh
        run: |
          $root = 'dist/win-unpacked/resources/app.asar.unpacked/native'
          foreach ($name in @('wifi.cs','audio-mixer.cs','device-control.ps1')) {
            if (!(Test-Path (Join-Path $root $name))) { throw "Missing native file: $name" }
          }
      - name: Stage assets and SHA-256
        shell: pwsh
        run: |
          New-Item release-assets -ItemType Directory -Force | Out-Null
          Copy-Item dist/*-Setup-x64.exe release-assets/
          Copy-Item package-lock.json release-assets/
          Copy-Item SYSTEM-CHECK.json release-assets/
          Get-ChildItem release-assets/* | Where-Object { !$_.PSIsContainer } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content release-assets/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: TTIsland-Windows-x64
          path: release-assets/*
          if-no-files-found: error
  draft:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TTIsland-Windows-x64
          path: release-assets
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if(process.env.RELEASE_TAG!=='v'+require('./package.json').version)process.exit(1)"
      - name: Create or update draft prerelease (never publish automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            STATE=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            test "$STATE" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --draft --prerelease --title "TTIsland $RELEASE_TAG" --notes-file RELEASE-NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
